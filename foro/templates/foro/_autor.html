{# Nombre del autor con insignia si es una cuenta de taller. Variable: autor #}
{% if autor.taller %}
  <a href="{{ autor.taller.get_absolute_url }}" class="font-semibold hover:text-[#f2611d]">{{ autor.taller }}</a>
  <span class="insignia {% if autor.taller.verificado %}insignia-verificado{% else %}insignia-lava{% endif %} ml-1">{% if autor.taller.verificado %}✔ Taller verificado{% else %}Taller{% endif %}</span>
{% else %}
  <span class="font-semibold">{{ autor.first_name|default:"Motociclista" }}</span>
{% endif %}
