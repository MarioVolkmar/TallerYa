{# Franja de avisos de hoy: pico y placa y vencimientos (necesita avisos = garaje.avisos.avisos_moto) #}
{% if avisos %}
<ul class="avisos-hoy" aria-label="Avisos de hoy">
  {% for a in avisos %}
  <li><a href="{{ a.url }}" class="aviso-hoy aviso-{{ a.nivel }}">
    <span class="aviso-hoy-icono" aria-hidden="true">{% if a.tipo == "general" %}<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="m6 6 12 12"/></svg>{% else %}<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>{% endif %}</span>
    <span class="min-w-0"><strong>{{ a.titulo }}</strong><small>{{ a.texto }}</small></span>
    <span class="aviso-hoy-ir" aria-hidden="true">→</span>
  </a></li>
  {% endfor %}
</ul>
{% endif %}
