{% load humanize %}{# Reparto del gasto por categoría. Variables: categorias, periodo ("todo" o índice del mes), oculto #}
<ul class="gs-tipos mt-3" data-reparto="{{ periodo }}"{% if oculto %} hidden{% endif %}>
  {% for c in categorias %}
  <li style="--c: {{ c.color }}"><span class="gs-tipo-nombre"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ c.icono }}"/></svg>{{ c.nombre }}</span><span class="gs-tipo-valor">${{ c.total|intcomma }} · {{ c.pct }} %</span>
    <span class="gs-tipo-barra" aria-hidden="true"><i style="width: {{ c.pct }}%"></i></span></li>
  {% endfor %}
</ul>
