{# Dibujo de una lámina del diagnóstico con sus piezas candidatas. Variable: e #}
    <figure class="diag-esq papel" data-esquema="{{ e.id }}">
      <div class="diag-esq-dibujo">
        <p class="diag-esq-pista">Toca un número para ver la pieza</p>
        <div class="diag-esq-lienzo">
          <img src="{{ e.imagen }}" alt="Dibujo de {{ e.nombre }}" loading="lazy" width="1000" height="1000" style="max-width:100%;height:auto">
          <svg viewBox="0 0 1000 1000" width="100%" height="100%" style="max-width:100%" role="group" aria-label="Piezas numeradas de {{ e.nombre }}">
            {% for m in e.marcas %}<line class="dg-linea{% if m.cand %} cand{% endif %}" data-id="{{ m.id }}" x1="{{ m.x }}" y1="{{ m.y }}" x2="{{ m.ax }}" y2="{{ m.ay }}"/>{% if m.cand %}<circle class="dg-punta dg-pulso" data-id="{{ m.id }}" cx="{{ m.ax }}" cy="{{ m.ay }}" r="22"/>{% endif %}{% endfor %}
            {% for m in e.marcas %}<g class="dg-num{% if m.cand %} cand{% endif %}" data-id="{{ m.id }}" data-guia-lamina="{{ e.id }}" data-guia-pieza="{{ m.id }}" tabindex="0" role="button" aria-label="{{ m.ref }} {{ m.nombre }}"><circle cx="{{ m.x }}" cy="{{ m.y }}" r="{% if m.cand %}24{% else %}19{% endif %}"/><text x="{{ m.x }}" y="{{ m.y }}">{{ m.ref }}</text></g>{% endfor %}
          </svg>
        </div>
      </div>
      <figcaption class="diag-esq-panel"><div class="diag-esq-panel-in">
        <strong class="diag-esq-titulo">{{ e.nombre }}</strong>
        {% if e.sospechosas %}
        <p class="diag-esq-rotulo cand">Puede ser una de estas</p>
        <ul class="diag-esq-lista">{% for m in e.sospechosas %}<li><button type="button" class="cand" data-id="{{ m.id }}" data-guia-lamina="{{ e.id }}" data-guia-pieza="{{ m.id }}" aria-haspopup="dialog"><span class="dg-ref">{{ m.ref }}</span><span class="dg-nombre">{{ m.nombre }}</span>{% if m.cantidad %}<span class="dg-cant">×{{ m.cantidad }}</span>{% endif %}</button></li>{% endfor %}</ul>
        {% endif %}
        {% if e.resto %}
        <p class="diag-esq-rotulo">Resto del sistema</p>
        <ul class="diag-esq-lista">{% for m in e.resto %}<li><button type="button" data-id="{{ m.id }}" data-guia-lamina="{{ e.id }}" data-guia-pieza="{{ m.id }}" aria-haspopup="dialog"><span class="dg-ref">{{ m.ref }}</span><span class="dg-nombre">{{ m.nombre }}</span>{% if m.cantidad %}<span class="dg-cant">×{{ m.cantidad }}</span>{% endif %}</button></li>{% endfor %}</ul>
        {% endif %}
      </div></figcaption>
    </figure>
