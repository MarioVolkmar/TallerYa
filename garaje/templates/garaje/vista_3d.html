{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Modelo 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #visor { position: absolute; inset: 0; }
  #visor canvas { display: block; width: 100%; height: 100%; }
  #visor-cargando { position: absolute; inset: 0; display: grid; place-items: center; color: #a7a294; font: 500 13px/1 "Oswald", sans-serif; letter-spacing: .2em; text-transform: uppercase; }
  #visor-ficha, #visor-ayuda, #visor-centrar { display: none !important; }
</style>
</head>
<body>
<div id="visor" data-modo="moto" data-vitrina>
  <div id="visor-cargando">Armando tu moto…</div>
  <button type="button" id="visor-centrar" hidden></button>
  <p id="visor-ayuda" hidden></p>
  <div id="visor-ficha" hidden></div>
</div>
{{ datos_3d|json_script:"datos-moto" }}
<script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
</script>
{# Después del importmap: descarga las librerías 3D en paralelo (si no, se piden una tras otra) #}
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/environments/RoomEnvironment.js" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/geometries/DecalGeometry.js" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/utils/BufferGeometryUtils.js" crossorigin>
<script type="module" src="{% static 'garaje/js/moto3d.js' %}"></script>
</body>
</html>
