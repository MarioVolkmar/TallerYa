<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img" aria-label="Dibujo de una scooter">
  <!-- Imagen fija que reemplaza el modelo 3D de las scooter cuando no hay gráficos 3D. Dibujo propio de TallerYa. -->
  <defs>
    <linearGradient id="carroceria" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#d9480f"/>
    </linearGradient>
    <radialGradient id="sombra" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="200" cy="198" rx="160" ry="13" fill="url(#sombra)"/>
  <!-- llantas pequeñas con rin de aleación -->
  <g>
    <circle cx="98" cy="164" r="32" fill="#2a3134"/><circle cx="98" cy="164" r="19" fill="#5b6468"/>
    <circle cx="302" cy="164" r="32" fill="#2a3134"/><circle cx="302" cy="164" r="19" fill="#5b6468"/>
    <g stroke="#c9c2b0" stroke-width="4" stroke-linecap="round">
      <path d="M98 150v28M86 157l24 14M86 171l24-14"/><path d="M302 150v28M290 157l24 14M290 171l24-14"/>
    </g>
    <circle cx="302" cy="164" r="16" fill="none" stroke="#9aa3a6" stroke-width="2" stroke-dasharray="3 3"/>
  </g>
  <!-- motor y transmisión debajo del asiento -->
  <path d="M86 150 C 110 132, 170 128, 196 140 L 190 160 L 104 164 Z" fill="#4a5357"/>
  <path d="M100 166 C 80 172, 66 168, 60 160" fill="none" stroke="#d6d1c4" stroke-width="7" stroke-linecap="round"/>
  <!-- carrocería trasera con asiento -->
  <path d="M74 132 C 80 98, 120 86, 190 92 L 214 128 C 190 140, 120 144, 74 140 Z" fill="url(#carroceria)"/>
  <path d="M90 104 C 120 92, 168 90, 196 94" stroke="#ffd2b0" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M86 92 C 110 78, 170 76, 200 84 L 196 94 C 160 88, 118 90, 88 100 Z" fill="#2b2420"/>
  <rect x="66" y="112" width="12" height="7" rx="2" fill="#ff3b2f"/>
  <!-- piso -->
  <path d="M196 140 L 262 140 L 266 150 L 192 152 Z" fill="#3a4246"/>
  <!-- escudo frontal y manubrio -->
  <path d="M258 146 C 262 112, 270 76, 284 48 L 304 52 C 300 86, 300 120, 292 150 Z" fill="url(#carroceria)"/>
  <path d="M286 58 C 282 84, 280 112, 280 140" stroke="#ffd2b0" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M284 48 L 270 32 M 270 32 h -16" stroke="#2a3134" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="302" cy="64" rx="7" ry="11" fill="#ffe7a6"/>
  <rect x="296" y="94" width="8" height="5" rx="2" fill="#f2a33a"/>
  <!-- horquilla y guardabarros -->
  <path d="M292 148 L 302 164" stroke="#b8bec2" stroke-width="6" stroke-linecap="round"/>
  <path d="M276 140 A 32 32 0 0 1 330 146" fill="none" stroke="url(#carroceria)" stroke-width="6" stroke-linecap="round"/>
</svg>
