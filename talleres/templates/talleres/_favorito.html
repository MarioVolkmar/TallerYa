{# Corazón para guardar un taller. Uso: {% include "talleres/_favorito.html" with taller=t clase="tc-fav" texto=False %} #}
{% if user.is_authenticated %}
<form method="post" action="{% url 'talleres:favorito' taller.slug %}" class="fav-form">{% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button type="submit" class="fav {{ clase }}{% if taller.es_favorito %} activo{% endif %}" aria-pressed="{% if taller.es_favorito %}true{% else %}false{% endif %}"
          title="{% if taller.es_favorito %}Quitar de favoritos{% else %}Guardar en favoritos{% endif %}" aria-label="Favorito: {{ taller.nombre }}"><svg viewBox="0 0 24 24" width="18" height="18" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.4C1.5 7.9 3.6 4.5 7 4.5c2 0 3.6 1.1 5 2.9 1.4-1.8 3-2.9 5-2.9 3.4 0 5.5 3.4 4.3 6.6-1.8 4.8-9.3 9.4-9.3 9.4Z"/></svg>{% if texto %}<span class="fav-texto">{% if taller.es_favorito %}En favoritos{% else %}Guardar{% endif %}</span>{% endif %}</button>
</form>
{% else %}
<a href="{% url 'cuentas:entrar' %}?next={{ request.get_full_path|urlencode }}" class="fav {{ clase }}" title="Entra para guardar tus talleres favoritos" aria-label="Guardar {{ taller.nombre }} en favoritos"><svg viewBox="0 0 24 24" width="18" height="18" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.4C1.5 7.9 3.6 4.5 7 4.5c2 0 3.6 1.1 5 2.9 1.4-1.8 3-2.9 5-2.9 3.4 0 5.5 3.4 4.3 6.6-1.8 4.8-9.3 9.4-9.3 9.4Z"/></svg>{% if texto %}<span class="fav-texto">Guardar</span>{% endif %}</a>
{% endif %}
