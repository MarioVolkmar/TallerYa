<!-- Detalle de una cita: se abre al tocar la cita (no sus botones) -->
<dialog class="papel rp-dialogo cd-dialogo" id="dialogo-cita-detalle" aria-label="Detalle de la cita">
  <button type="button" class="cajon-cerrar cd-cerrar" data-cerrar aria-label="Cerrar">×</button>
  <div class="cd-cuerpo"></div>
</dialog>
<script>
  (function () {
    var dialogo = document.getElementById("dialogo-cita-detalle"); if (!dialogo) return;
    var cuerpo = dialogo.querySelector(".cd-cuerpo");
    document.querySelectorAll("[data-cita-detalle]").forEach(function (fila) {
      fila.classList.add("cd-tocable");
      fila.setAttribute("tabindex", "0");
      function abrir(e) {
        if (e.target.closest("a, button, form, input, select, textarea")) return;  // los botones de la fila hacen lo suyo
        var plantilla = document.getElementById("cita-detalle-" + fila.dataset.citaDetalle); if (!plantilla) return;
        cuerpo.innerHTML = ""; cuerpo.appendChild(plantilla.content.cloneNode(true)); dialogo.showModal();
      }
      fila.addEventListener("click", abrir);
      fila.addEventListener("keydown", function (e) { if (e.key === "Enter" && e.target === fila) abrir(e); });
    });
    dialogo.querySelector("[data-cerrar]").addEventListener("click", function () { dialogo.close(); });
    dialogo.addEventListener("click", function (e) { if (e.target === dialogo) dialogo.close(); });
  })();
</script>
