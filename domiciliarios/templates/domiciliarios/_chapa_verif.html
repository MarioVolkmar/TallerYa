{# Chapa del estado de la verificación (franja de la moto y ficha de Mi ruta). Contexto: verificado, pendiente. #}
{% if verificado %}<span class="dm-chapa-verif dm-chapa-ok" title="Domiciliario verificado hasta el {{ verificado.vence|date:'j M Y' }}"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z" fill="currentColor"/><path d="m8.5 12 2.5 2.5 4.5-5" fill="none" stroke="#0b0e0f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Verificado</span>
{% elif pendiente %}<a href="{% url 'domiciliarios:verificacion' %}" class="dm-chapa-verif dm-chapa-espera" title="Revisamos tus fotos y te avisamos en la campana"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z"/><path d="M12 8v4l2 2"/></svg>En revisión</a>
{% else %}<a href="{% url 'domiciliarios:verificacion' %}" class="dm-chapa-verif dm-chapa-no" title="Verifícate con 2 fotos para la insignia y los descuentos Plus"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z"/></svg>Sin verificar</a>{% endif %}
