<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TallerYa · Talleres de motos en Medellín{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">
  <header class="bg-gray-900 text-white">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="{% url 'talleres:inicio' %}" class="text-xl font-extrabold">Taller<span class="text-orange-500">Ya</span></a>
      <a href="{% url 'talleres:registro' %}" class="text-sm bg-orange-500 hover:bg-orange-600 px-3 py-1.5 rounded-lg font-semibold">Registra tu taller</a>
    </div>
  </header>

  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-6">
    {% for m in messages %}
      <div class="mb-4 rounded-lg bg-green-100 text-green-800 px-4 py-3">{{ m }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>

  <footer class="text-center text-sm text-gray-500 py-6">TallerYa · Medellín</footer>
</body>
</html>
