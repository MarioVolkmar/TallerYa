{% load domiciliarios_tags %}{# Selector motero / taller / domiciliario / mecánico a domicilio del registro (activo = "motero", "taller" o "domiciliario") #}
<nav class="rc-tipo" aria-label="Tipo de cuenta">
  <a href="{% url 'cuentas:registro' %}?tipo=motero{% if next %}&amp;next={{ next|urlencode }}{% endif %}"{% if activo == "motero" %} class="activo" aria-current="page"{% endif %}>

  <a href="{% url 'cuentas:registro' %}?tipo=taller"{% if activo == "taller" %} class="activo" aria-current="page"{% endif %}>
