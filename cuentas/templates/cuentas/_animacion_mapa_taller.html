{% load static %}
{# Animación "pin en el mapa" del registro de taller: cae el pin del taller y las motos cercanas llegan hasta él. #}
<link rel="stylesheet" href="{% static 'talleres/css/escena-mapa-taller.css' %}">
<div class="rtm" aria-hidden="true">
  <svg class="rtm-mapa" viewBox="0 0 320 230" preserveAspectRatio="xMidYMid slice">
    <rect width="320" height="230" fill="#172023"/>
    <!-- manzanas y parques -->
    <g fill="#1d282b">
      <rect x="12" y="12" width="70" height="44" rx="6"/><rect x="100" y="12" width="88" height="44" rx="6"/><rect x="206" y="12" width="102" height="44" rx="6"/>
      <rect x="12" y="76" width="70" height="56" rx="6"/><rect x="206" y="76" width="102" height="56" rx="6"/>
      <rect x="12" y="152" width="70" height="66" rx="6"/><rect x="100" y="152" width="88" height="66" rx="6"/><rect x="206" y="152" width="102" height="66" rx="6"/>
    </g>
    <rect x="100" y="76" width="88" height="56" rx="6" fill="#1e3a2f"/>
    <circle cx="128" cy="98" r="6" fill="#245041"/><circle cx="150" cy="112" r="8" fill="#245041"/><circle cx="168" cy="94" r="5" fill="#245041"/>
    <!-- río -->
    <path d="M-10 214 C70 196 120 150 190 140 S290 104 340 70" fill="none" stroke="#1f3b4d" stroke-width="9" stroke-linecap="round"/>
    <!-- vías principales -->
    <path d="M0 66 H320 M0 142 H320 M91 0 V230 M197 0 V230" stroke="#24302f" stroke-width="7"/>
    <!-- rutas de las motos hasta el taller (144, 104) -->
    <path id="rtm-r1" class="rtm-ruta rtm-ruta1" pathLength="100" d="M16 222 C40 190 70 150 91 142 S130 120 144 108"/>
    <path id="rtm-r2" class="rtm-ruta rtm-ruta2" pathLength="100" d="M312 18 C280 40 230 60 197 66 S160 80 147 100"/>
    <path id="rtm-r3" class="rtm-ruta rtm-ruta3" pathLength="100" d="M314 200 C270 190 230 160 197 142 S158 120 148 108"/>
    <!-- motos -->
    <g class="rtm-moto rtm-m1"><use href="#rtm-icono-moto"/><animateMotion dur="8s" repeatCount="indefinite" rotate="0" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3;0.62;1"><mpath href="#rtm-r1"/></animateMotion></g>
    <g class="rtm-moto rtm-m2"><use href="#rtm-icono-moto"/><animateMotion dur="8s" repeatCount="indefinite" rotate="0" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.36;0.66;1"><mpath href="#rtm-r2"/></animateMotion></g>
    <g class="rtm-moto rtm-m3"><use href="#rtm-icono-moto"/><animateMotion dur="8s" repeatCount="indefinite" rotate="0" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.42;0.7;1"><mpath href="#rtm-r3"/></animateMotion></g>
    <defs>
      <g id="rtm-icono-moto">
        <circle r="7.5" fill="#111618" stroke="#e3a72f" stroke-width="1.3"/>
        <g fill="none" stroke="#ede3cc" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" transform="translate(-5.2 -3)">
          <circle cx="1.6" cy="4.4" r="1.6"/><circle cx="8.8" cy="4.4" r="1.6"/><path d="M1.6 4.4 3.6 1h3l2.2 3.4M5.2 1l1.3 3.4"/>
        </g>
      </g>
    </defs>
    <!-- pin del taller -->
    <g class="rtm-onda"><circle cx="146" cy="106" r="10" fill="none" stroke="#f2611d" stroke-width="2"/></g>
    <g class="rtm-pin">
      <path d="M146 106 c-10 -12 -15 -19 -15 -26 a15 15 0 0 1 30 0 c0 7 -5 14 -15 26z" fill="#f2611d" stroke="#1a0d05" stroke-width="1.5"/>
      <circle cx="146" cy="80" r="6" fill="#1a0d05"/>
    </g>
  </svg>
  <span class="rtm-ciudad">Medellín</span>
  <div class="rtm-tarjeta">
    <span class="rtm-logo">TY</span>
    <span class="rtm-texto"><strong>Tu taller</strong><small>Aparece en el mapa de los moteros</small></span>
  </div>
  <span class="rtm-llegaron"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4 10-10"/></svg>3 moteros cerca</span>
</div>
