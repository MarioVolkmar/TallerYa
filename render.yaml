# Blueprint de Render: en el panel de Render elige "New > Blueprint" y conecta este repositorio.
databases:
  - name: tallerya-db
    plan: free
    databaseName: tallerya
    user: tallerya

services:
  - type: web
    name: tallerya
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --timeout 60
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DATABASE_URL
        fromDatabase:
          name: tallerya-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      # Proxies de confianza delante de la app para leer la IP real (X-Forwarded-For). En Render: 1.
      - key: PROXIES_DE_CONFIANZA
        value: "1"
      - key: WEB_CONCURRENCY
        value: "2"
      # OJO: 1 = carga talleres, cupones y foro DE EJEMPLO (sirve para la demo de Ruta N). Poner "0" antes de abrir al
      # público, o el directorio mostrará talleres que no existen (revisión de seguridad 17-nov-2026).
      - key: CARGAR_DEMO
        value: "1"
      # Se piden al crear el Blueprint (no quedan en el repositorio):
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: TALLERYA_WHATSAPP
        sync: false
      - key: PLUS_NEQUI
        sync: false
      - key: PLUS_PRECIO_MENSUAL
        value: "9900"

      # Token de los endpoints /tareas/avisos/ y /tareas/citas/ que llama GitHub Actions a diario (gratis; ver .github/workflows/avisos.yml).
      # Pon el mismo valor en el secreto TAREAS_TOKEN de GitHub. Mínimo 20 caracteres.
      - key: TAREAS_TOKEN
        sync: false
      # Avisos push al celular (Web Push). Genera el par con `python manage.py generar_vapid`. Sin ellos el sitio funciona sin push.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Medición de uso propia (app metricas). Encendida por defecto; METRICAS_ACTIVAS=0 la apaga sin desplegar código.
      # - key: METRICAS_ACTIVAS
      #   value: "1"

  # Métricas de uso: resume por día y borra los eventos crudos de más de 90 días (Ley 1581). SIN ACTIVAR todavía.
  # Sin este cron el panel igual resume los días al abrirse, pero lo crudo no se borra. Alternativa gratis: llamarlo
  # desde el mismo GitHub Actions de /tareas/. Para activarlo, quitar los # (un cron de Render cuesta aparte):
  # - type: cron
  #   name: tallerya-metricas
  #   runtime: python
  #   schedule: "15 6 * * *"   # 1:15 a. m. en Medellín (UTC-5)
  #   buildCommand: pip install -r requirements.txt
  #   startCommand: python manage.py agregar_metricas
  #   envVars:
