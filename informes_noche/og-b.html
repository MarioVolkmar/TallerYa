<!doctype html><html lang="es"><head><meta charset="utf-8">
<title>Imagen para compartir · propuestas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&family=Oswald:wght@500..700&display=swap">
<style>
*{box-sizing:border-box;margin:0}
body{background:#0b0e0f;color:#ede3cc;font-family:Archivo,system-ui,sans-serif;padding:32px;display:grid;gap:40px;justify-content:center}
h1.t{font:600 20px Oswald,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:#e3a72f}
.og{position:relative;width:1200px;height:630px;overflow:hidden;border-radius:6px}
.og-logo{display:block}
.titular{font-family:Oswald,sans-serif;font-weight:700;text-transform:uppercase;line-height:1.02;letter-spacing:.01em}
.sub{font-size:26px;line-height:1.35;color:#d6ccb6}
.chip{display:inline-block;padding:10px 20px;border-radius:999px;font:600 22px Archivo,sans-serif}
.url{font:600 24px Oswald,sans-serif;letter-spacing:.12em;text-transform:uppercase}

/* A · Taller de noche */
.a{background:#111517}
.a::before{content:"";position:absolute;right:-120px;top:0;bottom:0;width:560px;background:repeating-linear-gradient(-55deg,#f2611d 0 34px,#111517 34px 68px);transform:skewX(-12deg);opacity:.95}
.a::after{content:"";position:absolute;right:300px;top:0;bottom:0;width:120px;background:linear-gradient(90deg,#111517,transparent);transform:skewX(-12deg)}
.a .izq{position:absolute;left:80px;top:60px;width:680px}
.a .og-logo{width:300px;height:auto;margin-bottom:36px}
.a .titular{font-size:64px;margin-bottom:22px}
.a .titular b{color:#f2611d}
.a .url{display:none}
.a .og-chispa{position:absolute;right:120px;bottom:30px;width:250px;height:auto;filter:drop-shadow(0 18px 24px rgba(0,0,0,.6))}

/* B · Lava */
.b{background:#f2611d;color:#111517}
.b .tarjeta{position:absolute;left:70px;top:70px;bottom:70px;width:700px;background:#111517;color:#ede3cc;border-radius:22px;padding:56px 60px;box-shadow:14px 14px 0 #0b0e0f}
.b .og-logo{width:300px;height:auto;margin-bottom:40px}
.b .titular{font-size:80px;margin-bottom:24px}
.b .titular b{color:#e3a72f}
.b .og-chispa{position:absolute;right:120px;top:90px;width:260px;height:auto}
.b .url{position:absolute;right:70px;bottom:52px;color:#111517}

/* C · Plano técnico */
.c{background:#1d2427;background-image:linear-gradient(#2b3437 1px,transparent 1px),linear-gradient(90deg,#2b3437 1px,transparent 1px);background-size:40px 40px}
.c::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(31,58,54,.0),rgba(17,21,23,.85) 75%)}
.c>*{position:relative;z-index:1}
.c .og-chispa{position:absolute;left:90px;top:110px;width:270px;height:auto;z-index:1}
.c .der{position:absolute;left:440px;top:80px;right:80px;z-index:1}
.c .og-logo{width:280px;height:auto;margin-bottom:34px}
.c .titular{font-size:64px;margin-bottom:30px}
.c .titular b{color:#e3a72f}
.c .chips{display:flex;flex-wrap:wrap;gap:14px}
.c .chip{border:2px solid #e3a72f;color:#ede3cc;background:rgba(227,167,47,.08)}
.c .url{position:absolute;right:80px;bottom:50px;color:#f2611d;z-index:1}
